<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Keneilwe! 🎂</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffe6f0 0%, #e8dff5 100%);
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      perspective: 1000px;
    }

    /* Floating Hearts Background */
    .floating-heart {
      position: absolute;
      font-size: 1.5rem;
      animation: float 6s infinite ease-in-out;
      opacity: 0.6;
      pointer-events: none;
    }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg) scale(0.8); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-10vh) rotate(360deg) scale(1.2); opacity: 0; }
    }

    /* Card Wrapper */
    .card-wrapper {
      width: 340px;
      height: 480px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .card-wrapper.open {
      transform: rotateY(-160deg);
    }

    /* Base Card Style */
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      backface-visibility: hidden;
      box-shadow: 0 15px 35px rgba(255, 154, 162, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 25px;
      border: 4px solid #fff;
    }

    /* Front Cover */
    .card-front {
      background: #ffb7b2;
      z-index: 2;
      text-align: center;
    }

    .mascot-container {
      font-size: 5rem;
      animation: bounce 2s infinite ease-in-out;
      margin-bottom: 10px;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,0.1));
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-15px) scale(1.05); }
    }

    .front-title {
      font-family: 'Fredoka One', cursive;
      color: #fff;
      font-size: 2.2rem;
      text-shadow: 3px 3px 0px #ff7b9c;
      letter-spacing: 1px;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .name-badge {
      background: #fff;
      color: #ff6b8b;
      font-family: 'Fredoka One', cursive;
      font-size: 1.6rem;
      padding: 6px 20px;
      border-radius: 50px;
      box-shadow: 0 5px 0px #ffb3c1;
      display: inline-block;
      transform: rotate(-3deg);
    }

    .tap-hint {
      position: absolute;
      bottom: 20px;
      background: rgba(255, 255, 255, 0.6);
      color: #ff477e;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 20px;
    }

    /* Inside Right */
    .card-back {
      background: #ffffff;
      transform: rotateY(180deg);
      text-align: center;
      justify-content: space-between;
    }

    .inside-title {
      font-family: 'Fredoka One', cursive;
      color: #ff6b8b;
      font-size: 1.8rem;
      margin-top: 10px;
    }

    .cake-icon {
      font-size: 3.5rem;
      margin: 10px 0;
      animation: wiggle 2s infinite ease-in-out;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    .inside-message {
      color: #6c5ce7;
      font-size: 1rem;
      line-height: 1.6;
      font-weight: 600;
    }

    .treat-decor {
      font-size: 1.5rem;
      margin-top: 10px;
    }

    /* Simple Confetti Canvas */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="floating-heart" style="left: 10%; animation-delay: 0s;">💖</div>
  <div class="floating-heart" style="left: 25%; animation-delay: 2s;">🌸</div>
  <div class="floating-heart" style="left: 70%; animation-delay: 1s;">✨</div>
  <div class="floating-heart" style="left: 85%; animation-delay: 3s;">🎀</div>

  <canvas id="confetti"></canvas>

  <div class="card-wrapper" id="card" onclick="openCard()">
    
    <div class="card-face card-front">
      <div class="mascot-container">🐻🎉</div>
      <div class="front-title">HAPPY<br>BIRTHDAY</div>
      <div class="name-badge">Keneilwe!</div>
      <div class="tap-hint">Tap to open 🎁</div>
    </div>

    <div class="card-face card-back">
      <div class="inside-title">Yay, It's Your Day! 🎉</div>
      
      <div class="cake-icon">🎂</div>

      <p class="inside-message">
        Wishing you the absolute happiest birthday full of sweet treats, big smiles, and tons of fun! <br><br>
        Hope your year ahead is as amazing and sweet as you are! 💖
      </p>

      <div class="treat-decor">🎈 🎁 🍓 🍰 ✨</div>
    </div>

  </div>

  <script>
    let opened = false;

    function openCard() {
      const card = document.getElementById('card');
      card.classList.toggle('open');
      
      if (!opened) {
        popConfetti();
        opened = true;
      }
    }

    // Mini Cute Confetti Effect
    function popConfetti() {
      const canvas = document.getElementById('confetti');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = [];
      const colors = ['#ff7b9c', '#ffb7b2', '#ffda79', '#a29bfe', '#74b9ff'];

      for (let i = 0; i < 60; i++) {
        pieces.push({
          x: window.innerWidth / 2,
          y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.5) * 12 - 4,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.2; // gravity
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });

        if (pieces.some(p => p.y < canvas.height)) {
          requestAnimationFrame(animate);
        }
      }
      animate();
    }
  </script>
</body>
</html>

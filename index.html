<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Keneilwe!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&family=Great+Vibes&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      perspective: 1200px;
    }

    /* Ambient Background Glow Particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.3);
      animation: floatUp 8s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 0;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    /* Card Container */
    .card-container {
      width: 380px;
      height: 520px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .card-container.open {
      transform: rotateY(-160deg);
    }

    /* Card Surfaces */
    .card-side {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      backface-visibility: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    /* Front Cover */
    .card-front {
      background: linear-gradient(135deg, #2c3e50, #000000);
      border: 1px solid rgba(212, 175, 55, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      z-index: 2;
    }

    .card-front::before {
      content: '';
      position: absolute;
      inset: 12px;
      border: 1px dashed rgba(212, 175, 55, 0.4);
      border-radius: 10px;
      pointer-events: none;
    }

    .cover-icon {
      font-size: 3rem;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.5));
    }

    .cover-title {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      color: #d4af37;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .cover-subtitle {
      font-family: 'Great Vibes', cursive;
      font-size: 2.8rem;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
    }

    .click-hint {
      position: absolute;
      bottom: 25px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Inside Right (Main Content) */
    .card-back {
      background: #fdfbf7;
      color: #2c3e50;
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 30px;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .card-back::before {
      content: '';
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 10px;
      pointer-events: none;
    }

    .inside-header {
      font-family: 'Great Vibes', cursive;
      font-size: 2.8rem;
      color: #b8860b;
      text-align: center;
      margin-top: 10px;
    }

    .inside-body {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #4a4a4a;
      text-align: center;
      margin: 20px 0;
      font-weight: 300;
    }

    .inside-footer {
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      color: #d4af37;
      letter-spacing: 1.5px;
      font-weight: 700;
    }

    .accent-symbol {
      display: block;
      margin-top: 5px;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="particle" style="width: 8px; height: 8px; left: 15%; animation-duration: 7s; animation-delay: 0s;"></div>
  <div class="particle" style="width: 12px; height: 12px; left: 35%; animation-duration: 9s; animation-delay: 2s;"></div>
  <div class="particle" style="width: 6px; height: 6px; left: 70%; animation-duration: 6s; animation-delay: 1s;"></div>
  <div class="particle" style="width: 10px; height: 10px; left: 85%; animation-duration: 10s; animation-delay: 3s;"></div>

  <div class="card-container" id="card" onclick="toggleCard()">
    
    <div class="card-side card-front">
      <div class="cover-icon">✨</div>
      <div class="cover-title">Celebrating</div>
      <div class="cover-subtitle">Keneilwe</div>
      <div class="click-hint">Click to Open</div>
    </div>

    <div class="card-side card-back">
      <div class="inside-header">Happy Birthday!</div>
      
      <p class="inside-body">
        Wishing you a day filled with laughter, joy, and unforgettable moments. 
        May this year bring incredible opportunities, genuine happiness, 
        and all the success you deserve. 
      </p>

      <div class="inside-footer">
        CHEERS TO YOU
        <span class="accent-symbol">✦</span>
      </div>
    </div>

  </div>

  <script>
    function toggleCard() {
      const card = document.getElementById('card');
      card.classList.toggle('open');
    }
  </script>
</body>
</html>
